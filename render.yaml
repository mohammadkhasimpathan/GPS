services:
  # ── Backend: Django + Daphne (ASGI) ────────────────────────────────────
  - type: web
    name: guardianlink-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --no-input && python manage.py collectstatic --no-input
    startCommand: daphne -b 0.0.0.0 -p $PORT guardianlink.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SETTINGS_MODULE
        value: guardianlink.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: guardianlink-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: guardianlink-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "guardianlink-backend.onrender.com"
      - key: CORS_ORIGIN
        value: "https://guardianlink.onrender.com"
      - key: FRONTEND_URL
        value: "https://guardianlink.onrender.com"
    healthCheckPath: /api/health/

  # ── Frontend: React SPA (Static) ────────────────────────────────────────
  - type: web
    name: guardianlink
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: "https://guardianlink-backend.onrender.com/api"
      - key: VITE_WS_URL
        value: "wss://guardianlink-backend.onrender.com"

  # ── Redis (Free) ────────────────────────────────────────────────────────
  - type: redis
    name: guardianlink-redis
    region: oregon
    plan: free
    ipAllowList: []

# ── PostgreSQL (Free) ───────────────────────────────────────────────────────
databases:
  - name: guardianlink-db
    databaseName: guardianlink
    user: guardianlink
    region: oregon
    plan: free
